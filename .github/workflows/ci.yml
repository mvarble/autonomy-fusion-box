name: CI

# Every push is checked, and a push that passes publishes the site to GitHub Pages: drafts on a
# working branch included, so the site shows the latest push.
on:
    push:
    pull_request:

permissions:
    contents: read

env:
    # Where GitHub Pages serves the site: under the repository's name, not at the root of a domain.
    SITE_ORIGIN: https://mvarble.github.io
    SITE_BASE: /autonomy-fusion-box

jobs:
    workflow:
        name: Workflow rules
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Test the tooling
              run: node --test 'tools/*/*.test.ts'
            - name: Check the rules against the base branch
              if: github.event_name == 'pull_request'
              run: |
                  flags=""
                  if [ "${{ github.base_ref }}" = "main" ]; then flags="--merge"; fi
                  bin/wf check --base "origin/${{ github.base_ref }}" $flags
            # `main` must have no entry in progress; a working branch may.
            - name: Check the rules
              if: github.event_name == 'push'
              run: |
                  flags=""
                  if [ "${{ github.ref }}" = "refs/heads/main" ]; then flags="--merge"; fi
                  bin/wf check $flags

    site:
        name: Site
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: site
        steps:
            - uses: actions/checkout@v4
              with:
                  # Documents without dates take them from the git history.
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
              with:
                  version: 12
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: site/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm lint
            - run: pnpm test
            - name: Type-check the tooling
              run: node_modules/.bin/tsc -p ../tools
            - name: Build the site
              run: pnpm build
              env:
                  SITE_URL: ${{ env.SITE_ORIGIN }}
                  BASE_PATH: ${{ env.SITE_BASE }}
            - name: Keep the site for publishing
              if: github.event_name == 'push' && !github.event.repository.private
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site/build

    pages:
        name: Publish the site
        needs: [workflow, site]
        if: github.event_name == 'push' && !github.event.repository.private
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        # One deployment at a time, each to completion, so the last push is the one left standing.
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
